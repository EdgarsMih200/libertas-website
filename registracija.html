<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reģistrācija — Libertas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Galvene / Navigācija -->
    <header class="site-header">
        <div class="container nav-wrapper">
            <a href="index.html" class="logo" aria-label="Libertas – uz sākumlapu">
                <img src="assets/libertas.png" alt="LIBERTAS Logo">
            </a>
            <nav class="main-nav">
                <a href="index.html#kursi">Kursi</a>
                <a href="index.html#par-mums">Par mums</a>
            </nav>
        </div>
    </header>

    <!-- Reģistrācijas forma -->
    <section class="register-section container">
        <div class="register-card">
            <h1 class="section-title">Pieteikšanās kursam</h1>
            <p class="register-intro">Aizpildi formu, un mēs ar tevi sazināsimies, lai apstiprinātu vietu kursā.</p>

            <form id="registerForm" class="register-form">
                <label for="course">Kurss</label>
                <select id="course" name="course" required>
                    <option value="" disabled selected>Izvēlies kursu</option>
                    <option value="spain-a1">Spāņu valodas pamati (A1) — 280,00 EUR</option>
                    <option value="english-a1">Angļu valodas pamati (A1) — 280,00 EUR</option>
                </select>

                <div class="form-row">
                    <div>
                        <label for="firstName">Vārds</label>
                        <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
                    </div>
                    <div>
                        <label for="lastName">Uzvārds</label>
                        <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
                    </div>
                </div>

                <label for="email">E-pasts</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="phone">Tālrunis</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+371">

                <label for="message">Jautājumi vai komentāri <span class="optional">(nav obligāti)</span></label>
                <textarea id="message" name="message" rows="4"></textarea>

                <label class="checkbox">
                    <input type="checkbox" id="consent" name="consent" required>
                    <span>Piekrītu, ka Libertas izmanto manus datus, lai sazinātos par pieteikumu.</span>
                </label>

                <button type="submit" class="btn-cta btn-submit">
                    <span class="btn-title">NOSŪTĪT PIETEIKUMU</span>
                </button>
            </form>

            <div id="registerDone" class="register-done" hidden>
                <h2>Paldies!</h2>
                <p>Tavā e-pasta programmā ir sagatavota vēstule ar pieteikumu — nosūti to, un mēs drīz ar tevi sazināsimies.</p>
                <a href="index.html" class="btn-secondary"><span class="btn-title">ATPAKAĻ UZ SĀKUMU</span></a>
            </div>
        </div>
    </section>

    <!-- Kājene -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Libertas. Visas tiesības aizsargātas.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
