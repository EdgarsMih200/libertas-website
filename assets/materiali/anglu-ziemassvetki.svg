<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <!-- Angļu Ziemassvētki: Christmas pudding ar ilexu, sarkanrīklīte (robin) un Christmas cracker uz tumši zaļa fona.
       Galvenais motīvs labajā pusē, lai sveiciens apakšā pa kreisi būtu salasāms. -->
  <defs>
    <radialGradient id="fons" cx="70%" cy="40%" r="80%">
      <stop offset="0" stop-color="#2F5444"/>
      <stop offset=".55" stop-color="#1F3B30"/>
      <stop offset="1" stop-color="#12241D"/>
    </radialGradient>
    <radialGradient id="mirdzums" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F6C46A" stop-opacity=".5"/>
      <stop offset="1" stop-color="#F6C46A" stop-opacity="0"/>
    </radialGradient>
    <symbol id="lapa" viewBox="-30 -12 60 24" overflow="visible">
      <path d="M-28 0 l6-6 l2 4 l7-8 l1 6 l8-6 l0 6 l8-6 l1 6 l7-8 l2 4 l6 2 l-6 2 l-2 4 l-7-8 l-1 6 l-8-6 l0 6 l-8-6 l-1 6 l-7-8 l-2 4z" fill="#6FAE7E"/>
      <path d="M-24 0 H24" stroke="#3E7A56" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="parsla" viewBox="-8 -8 16 16" overflow="visible">
      <g stroke="#F6F1E8" stroke-width="1.6" stroke-linecap="round"><path d="M0-7v14M-6-3.5l12 7M-6 3.5l12-7"/></g>
    </symbol>
  </defs>

  <rect width="600" height="320" fill="url(#fons)"/>

  <!-- parslas un zelta punkti -->
  <g opacity=".55">
    <use href="#parsla" x="-8" y="-8" width="16" height="16" transform="translate(60 40)"/>
    <use href="#parsla" x="-8" y="-8" width="16" height="16" transform="translate(210 70) scale(.8)"/>
    <use href="#parsla" x="-8" y="-8" width="16" height="16" transform="translate(300 28) scale(.7)"/>
    <use href="#parsla" x="-8" y="-8" width="16" height="16" transform="translate(560 36) scale(.9)"/>
    <use href="#parsla" x="-8" y="-8" width="16" height="16" transform="translate(130 130) scale(.6)"/>
    <use href="#parsla" x="-8" y="-8" width="16" height="16" transform="translate(580 150) scale(.7)"/>
  </g>
  <g fill="#F2C46A" opacity=".55">
    <circle cx="110" cy="30" r="1.8"/><circle cx="260" cy="112" r="1.5"/><circle cx="36" cy="96" r="1.5"/>
    <circle cx="520" cy="96" r="1.8"/><circle cx="180" cy="20" r="1.3"/>
  </g>

  <!-- vītne augšā ar spuldzītēm -->
  <path d="M240 -4 Q330 40 420 18 T600 22" fill="none" stroke="#12241D" stroke-width="2"/>
  <g>
    <circle cx="278" cy="20" r="4.5" fill="#B8432F"/><circle cx="318" cy="31" r="4.5" fill="#F2C46A"/>
    <circle cx="358" cy="31" r="4.5" fill="#7FA9B5"/><circle cx="398" cy="23" r="4.5" fill="#B8432F"/>
    <circle cx="440" cy="16" r="4.5" fill="#F2C46A"/><circle cx="482" cy="18" r="4.5" fill="#7FA9B5"/>
    <circle cx="524" cy="25" r="4.5" fill="#B8432F"/><circle cx="566" cy="23" r="4.5" fill="#F2C46A"/>
  </g>

  <!-- galds -->
  <path d="M0 262 H600 V320 H0Z" fill="#6B3A2A"/>
  <path d="M0 262 H600 V270 H0Z" fill="#7E4A35"/>

  <!-- pudding -->
  <circle cx="420" cy="170" r="110" fill="url(#mirdzums)"/>
  <g transform="translate(420 186)">
    <!-- šķīvis -->
    <ellipse cx="0" cy="76" rx="118" ry="18" fill="#0C1A14" opacity=".45"/>
    <ellipse cx="0" cy="70" rx="112" ry="18" fill="#F6F1E8"/>
    <ellipse cx="0" cy="68" rx="88" ry="12" fill="#E6DCCB"/>
    <!-- kupols -->
    <path d="M-80 66 C-84 0 -48 -50 0 -50 C48 -50 84 0 80 66Z" fill="#5A2E22"/>
    <path d="M-80 66 C-84 0 -48 -50 0 -50 C-30 -40 -60 0 -60 66Z" fill="#4A241A"/>
    <!-- rozīnes -->
    <g fill="#2A1510">
      <ellipse cx="-36" cy="30" rx="5" ry="3.4"/><ellipse cx="-10" cy="48" rx="5" ry="3.4"/>
      <ellipse cx="22" cy="34" rx="5" ry="3.4"/><ellipse cx="50" cy="52" rx="5" ry="3.4"/>
      <ellipse cx="-56" cy="54" rx="4.5" ry="3"/><ellipse cx="44" cy="14" rx="4.5" ry="3"/>
      <ellipse cx="4" cy="60" rx="4.5" ry="3"/><ellipse cx="-24" cy="10" rx="4" ry="2.8"/>
    </g>
    <!-- krēms (custard) -->
    <path d="M-62 -14 C-50 -44 -22 -54 0 -54 C22 -54 50 -44 62 -14 C56 -4 52 14 46 4 C40 -6 36 16 28 8 C22 2 18 22 10 10 C4 2 -2 20 -10 8 C-16 0 -22 18 -30 6 C-36 -2 -42 14 -48 2 C-52 -6 -58 4 -62 -14Z" fill="#FBF0D2"/>
    <path d="M-40 -40 C-28 -48 -12 -52 4 -52" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".7"/>
    <!-- ilekss -->
    <use href="#lapa" x="-30" y="-12" width="60" height="24" transform="translate(-26 -60) rotate(-24) scale(1.35)"/>
    <use href="#lapa" x="-30" y="-12" width="60" height="24" transform="translate(28 -62) rotate(20) scale(1.35)"/>
    <g fill="#B8432F">
      <circle cx="-4" cy="-62" r="7"/><circle cx="8" cy="-58" r="7"/><circle cx="1" cy="-50" r="7"/>
    </g>
    <g fill="#FFF3E2" opacity=".8"><circle cx="-6" cy="-64" r="1.8"/><circle cx="6" cy="-60" r="1.8"/><circle cx="-1" cy="-52" r="1.8"/></g>
  </g>

  <!-- robin uz galda pa labi -->
  <g transform="translate(560 236)">
    <path d="M-4 24 l-3 8M4 24 l3 8" stroke="#3B2F2F" stroke-width="2" stroke-linecap="round"/>
    <path d="M14 6 l18 -4 l-4 10z" fill="#6B4A3A"/>
    <ellipse cx="0" cy="8" rx="20" ry="17" fill="#8A6A55"/>
    <path d="M-20 6 C-20 -4 -12 -10 -2 -8 C-4 4 -4 16 -10 22 C-16 18 -20 14 -20 6Z" fill="#D8642E"/>
    <ellipse cx="2" cy="18" rx="10" ry="6" fill="#EBDCC4"/>
    <circle cx="-12" cy="-10" r="11" fill="#8A6A55"/>
    <path d="M-23 -8 C-22 -2 -16 2 -10 0 C-12 -4 -16 -8 -23 -8Z" fill="#D8642E"/>
    <circle cx="-15" cy="-13" r="2.2" fill="#1A1219"/>
    <path d="M-22 -12 l-8 2 l8 2z" fill="#3B2F2F"/>
  </g>

  <!-- Christmas cracker pa kreisi no puddinga -->
  <g transform="translate(250 274) rotate(-8)">
    <path d="M-56 -10 L-40 -14 L-40 14 L-56 10Z" fill="#B8432F"/>
    <path d="M40 -14 L56 -10 L56 10 L40 14Z" fill="#B8432F"/>
    <rect x="-40" y="-11" width="80" height="22" rx="3" fill="#B8432F"/>
    <rect x="-40" y="-11" width="80" height="6" rx="3" fill="#D45A42"/>
    <path d="M-40 -11 v22 M40 -11 v22" stroke="#8E2A22" stroke-width="3"/>
    <rect x="-14" y="-11" width="28" height="22" fill="#F2C46A"/>
    <path d="M-6 -11 l6 6 l6 -6 M-6 11 l6 -6 l6 6" fill="none" stroke="#B07A1F" stroke-width="1.6"/>
    <g fill="#F6F1E8"><circle cx="-28" cy="2" r="2"/><circle cx="28" cy="2" r="2"/></g>
  </g>
</svg>
