<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <!-- Día de Muertos materiāla vāks: plakana, moderna calavera ar samtenēm un svecēm (teksts apakšā pa kreisi) -->
  <defs>
    <radialGradient id="fons" cx="70%" cy="40%" r="75%">
      <stop offset="0" stop-color="#5A2433"/>
      <stop offset=".55" stop-color="#3A1A28"/>
      <stop offset="1" stop-color="#22141C"/>
    </radialGradient>
    <radialGradient id="mirdzums" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2C46A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F2C46A" stop-opacity="0"/>
    </radialGradient>
    <!-- samtene (cempasúchil): kārtas ar "plīsumainām" ziedlapiņām no pārtrauktas līnijas -->
    <symbol id="samtene" viewBox="-30 -30 60 60" overflow="visible">
      <circle r="22" fill="none" stroke="#C9561F" stroke-width="12" stroke-dasharray="5 3"/>
      <circle r="15" fill="none" stroke="#E8892E" stroke-width="11" stroke-dasharray="4 2.5"/>
      <circle r="8" fill="none" stroke="#F2A93B" stroke-width="9" stroke-dasharray="3 2"/>
      <circle r="3.5" fill="#F7D27A"/>
    </symbol>
    <symbol id="svece" viewBox="-14 -60 28 100" overflow="visible">
      <circle cy="-40" r="26" fill="url(#mirdzums)"/>
      <path d="M0-52c6 8 7 14 0 18-7-4-6-10 0-18z" fill="#F2C46A"/>
      <path d="M0-46c3 4 3 8 0 10-3-2-3-6 0-10z" fill="#FFF3E2"/>
      <rect x="-9" y="-32" width="18" height="70" rx="3" fill="#F6F1E8"/>
      <rect x="-9" y="-32" width="5" height="70" rx="2" fill="#E6DCCB"/>
    </symbol>
  </defs>

  <rect width="600" height="320" fill="url(#fons)"/>

  <!-- ģeometriski punkti un zvaigznītes fonā -->
  <g fill="#F2C46A" opacity=".5">
    <circle cx="300" cy="40" r="2"/><circle cx="548" cy="30" r="2.5"/><circle cx="262" cy="118" r="1.6"/>
    <circle cx="580" cy="150" r="2"/><circle cx="210" cy="60" r="1.4"/><circle cx="120" cy="40" r="2"/>
    <circle cx="60" cy="96" r="1.5"/><circle cx="168" cy="140" r="1.8"/>
  </g>
  <g fill="none" stroke="#E8892E" stroke-width="2" stroke-linecap="round" opacity=".7">
    <path d="M520 70v14M513 77h14"/><path d="M90 150v10M85 155h10"/><path d="M240 30v10M235 35h10"/>
  </g>

  <!-- galvenais motīvs pa labi augšā, lai sveiciens kreisajā apakšā to neaizsedz -->
  <g transform="translate(85 -5) scale(.88)">
  <!-- oreols aiz galvaskausa -->
  <circle cx="410" cy="150" r="128" fill="none" stroke="#F2C46A" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" opacity=".7"/>
  <circle cx="410" cy="150" r="112" fill="#6B1D1D" opacity=".55"/>

  <!-- samteņu vainags ap galvaskausu -->
  <g>
    <use href="#samtene" x="-30" y="-30" width="60" height="60" transform="translate(312 92) scale(.9)"/>
    <use href="#samtene" x="-30" y="-30" width="60" height="60" transform="translate(352 46) scale(.75)"/>
    <use href="#samtene" x="-30" y="-30" width="60" height="60" transform="translate(468 46) scale(.75)"/>
    <use href="#samtene" x="-30" y="-30" width="60" height="60" transform="translate(508 92) scale(.9)"/>
    <use href="#samtene" x="-30" y="-30" width="60" height="60" transform="translate(410 30) scale(.6)"/>
  </g>
  <!-- lapiņas -->
  <g fill="#5F7C6D">
    <path d="M330 70c10-14 24-16 30-14-4 12-16 18-30 14z"/>
    <path d="M490 70c-10-14-24-16-30-14 4 12 16 18 30 14z"/>
    <path d="M384 30c-6-10-16-12-22-10 4 9 12 12 22 10z"/>
    <path d="M436 30c6-10 16-12 22-10-4 9-12 12-22 10z"/>
  </g>

  <!-- calavera -->
  <g transform="translate(410 150)">
    <path d="M-78-6c0-50 35-82 78-82s78 32 78 82c0 26-11 44-27 54v24c0 8-6 14-14 14h-74c-8 0-14-6-14-14V48c-16-10-27-28-27-54z" fill="#F6F1E8"/>
    <!-- pieres rotājums -->
    <g transform="translate(0 -52)">
      <path d="M0-16c5 6 5 12 0 16-5-4-5-10 0-16zM0 16c5-6 5-12 0-16-5 4-5 10 0 16zM-16 0c6-5 12-5 16 0-4 5-10 5-16 0zM16 0c-6-5-12-5-16 0 4 5 10 5 16 0z" fill="#B4502A"/>
      <circle r="4" fill="#F2C46A"/>
      <g fill="#6B1D1D"><circle cx="-30" cy="6" r="3"/><circle cx="30" cy="6" r="3"/><circle cx="-22" cy="-6" r="2.2"/><circle cx="22" cy="-6" r="2.2"/></g>
    </g>
    <!-- acis: ziedi -->
    <g transform="translate(-32 2)">
      <circle r="27" fill="none" stroke="#E8892E" stroke-width="7" stroke-dasharray="6 4"/>
      <circle r="20" fill="#22141C"/>
      <circle cx="6" cy="-6" r="4" fill="#F6F1E8"/>
    </g>
    <g transform="translate(32 2)">
      <circle r="27" fill="none" stroke="#5F7C6D" stroke-width="7" stroke-dasharray="6 4"/>
      <circle r="20" fill="#22141C"/>
      <circle cx="6" cy="-6" r="4" fill="#F6F1E8"/>
    </g>
    <!-- deguns -->
    <path d="M0 26c-5 0-10 8-10 13 0 4 5 4 10 0 5 4 10 4 10 0 0-5-5-13-10-13z" fill="#22141C"/>
    <!-- vaigu spirāles -->
    <g fill="#B4502A">
      <path d="M-48 42c-4-5-12-2-9 4l9 8 9-8c3-6-5-9-9-4z"/>
      <path d="M48 42c-4-5-12-2-9 4l9 8 9-8c3-6-5-9-9-4z"/>
    </g>
    <g fill="#F2C46A"><circle cx="-60" cy="30" r="2.5"/><circle cx="-38" cy="30" r="2"/><circle cx="60" cy="30" r="2.5"/><circle cx="38" cy="30" r="2"/></g>
    <!-- zobi -->
    <path d="M-34 58h68" stroke="#22141C" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#22141C" stroke-width="2.5" stroke-linecap="round">
      <path d="M-22 52v14M-11 52v14M0 52v14M11 52v14M22 52v14"/>
    </g>
    <g fill="#F2C46A"><circle cx="-16" cy="80" r="2.5"/><circle cx="0" cy="82" r="2.5"/><circle cx="16" cy="80" r="2.5"/></g>
  </g>

  </g>

  <!-- sveces labajā apakšā -->
  <use href="#svece" x="-14" y="-60" width="28" height="100" transform="translate(548 268)"/>
  <use href="#svece" x="-14" y="-60" width="28" height="100" transform="translate(576 286) scale(.75)"/>
  <use href="#svece" x="-14" y="-60" width="28" height="100" transform="translate(272 292) scale(.7)"/>

  <!-- izkaisītas ziedlapiņas -->
  <g fill="#E8892E">
    <ellipse cx="250" cy="210" rx="6" ry="3" transform="rotate(-30 250 210)"/>
    <ellipse cx="530" cy="200" rx="6" ry="3" transform="rotate(25 530 200)"/>
    <ellipse cx="300" cy="250" rx="5" ry="2.5" transform="rotate(60 300 250)"/>
    <ellipse cx="200" cy="170" rx="5" ry="2.5" transform="rotate(10 200 170)"/>
  </g>
  <use href="#samtene" x="-30" y="-30" width="60" height="60" transform="translate(500 300) scale(.6)"/>
  <use href="#samtene" x="-30" y="-30" width="60" height="60" transform="translate(326 302) scale(.55)"/>
</svg>
